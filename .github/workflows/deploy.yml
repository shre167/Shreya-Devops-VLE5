name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-vle5-app:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run -d --name test-app -p 3000:3000 devops-vle5-app:${{ github.sha }}

          echo "Waiting for application to start..."

          for i in {1..15}; do
            if curl --fail --silent http://localhost:3000; then
              echo
              echo "Application test passed!"
              docker stop test-app
              docker rm test-app
              exit 0
            fi

            echo "Attempt $i failed. Waiting 2 seconds..."
            sleep 2
          done

          echo "Application failed to respond."
          echo "Container logs:"
          docker logs test-app

          docker stop test-app || true
          docker rm test-app || true
          exit 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy application to EC2
        uses: appleboy/scp-action@v1
        with:
          host: 54.209.127.138
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "server.js,package.json,Dockerfile,k8s/deployment.yaml"
          target: "/home/ec2-user/devops-app"

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1
        with:
          host: 54.209.127.138
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/devops-app
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            docker build -t devops-vle5-app:${{ github.sha }} .

            docker save devops-vle5-app:${{ github.sha }} -o /tmp/devops-vle5-app.tar

            sudo k3s ctr images import /tmp/devops-vle5-app.tar

            sed -i "s|image: devops-vle5-app:.*|image: devops-vle5-app:${{ github.sha }}|" k8s/deployment.yaml

            kubectl apply -f k8s/deployment.yaml

            kubectl rollout status deployment/devops-vle5-app

            rm -f /tmp/devops-vle5-app.tar
