apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-vle5-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-vle5-app
  template:
    metadata:
      labels:
        app: devops-vle5-app
    spec:
      containers:
        - name: devops-vle5-app
          image: devops-vle5-app:f8e33c81257d919510353ec8ed7ded94457ce937
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-vle5-service
spec:
  selector:
    app: devops-vle5-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: NodePort
